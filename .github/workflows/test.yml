name: FDE Workbench Deterministic CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Deterministic Gates & Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Gate 1 - Unit Test Suite (72 Tests)
      run: |
        python -m unittest discover -s tests -p "test_*.py" -v

    - name: Gate 2 - Cryptographic Audit Trail Verification
      run: |
        python -m fde_workbench verify-audit

    - name: Gate 3 - FDE Discovery Intake Compilation
      run: |
        python -m fde_workbench discover --intake aidesa_discovery_intake.json

    - name: Gate 4 - Pilot Economics Mathematical Bridge
      run: |
        python run_workbench.py pilot economics pilot-2026-customs-recon
        python run_workbench.py pilot economics pilot-2026-fluvial-draft
